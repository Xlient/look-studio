name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: us-central1
  SERVICE: look-studio-api
  FIREBASE_TOOLS: firebase-tools@15.34.1

jobs:
  api-image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t "$SERVICE:${{ github.sha }}" .
      - name: Boot check
        run: |
          docker run -d --rm --name api -e PORT=8080 -p 8080:8080 "$SERVICE:${{ github.sha }}"
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && exit 0; sleep 1; done
          docker logs api
          exit 1

  preview:
    name: Hosting preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @look-studio/web build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Deploy preview channel
        run: |
          npx -y "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --expires 7d --json > channel.json
          url=$(node -e 'const r=require("./channel.json").result; console.log(Object.values(r)[0].url)')
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy API and Hosting
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    needs: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/look-studio/look-studio-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - run: docker build -f apps/server/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"
      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" \
            --allow-unauthenticated --max-instances 1 --min-instances 0 --cpu 1 --memory 512Mi --timeout 300 \
            --set-secrets MODEL_API_KEY=model-api-key:latest \
            --set-env-vars "DAILY_SPEND_CAP_USD=${{ vars.DAILY_SPEND_CAP_USD || '5' }},RATE_LIMIT_MAX=${{ vars.RATE_LIMIT_MAX || '60' }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @look-studio/web build
      - run: npx -y "$FIREBASE_TOOLS" deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
      - name: Smoke check
        run: |
          site="https://${{ vars.GCP_PROJECT_ID }}.web.app"
          curl -sf "$site/" | grep -q "<div id=\"root\">"
          curl -sf "$site/api/health" | grep -q '"ok":true'
          echo "Live: $site" >> "$GITHUB_STEP_SUMMARY"
